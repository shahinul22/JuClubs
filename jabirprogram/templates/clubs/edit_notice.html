{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto p-6 bg-white rounded-xl shadow">
  <h2 class="text-2xl font-bold mb-4">Edit Notice</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn bg-blue-600 text-white mt-2">Save Changes</button>
    <a href="{% url 'clubs:club_profile' club_id=notice.club.id %}?tab=notice" class="btn ml-2">Cancel</a>
  </form>
</div>
{% endblock %}
